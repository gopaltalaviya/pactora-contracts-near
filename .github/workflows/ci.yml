name: contracts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned, so a release of cargo-near cannot turn CI red on code nobody touched.
  CARGO_NEAR_VERSION: "0.22.0"

jobs:
  check:
    name: fmt · clippy · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml (rustup reads it).
      - name: Toolchain
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and property tests
        run: cargo test --workspace --lib

  wasm:
    name: build wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          cargo near --version
      - name: Build both contracts
        run: |
          for c in pactora mock-usdc; do
            (cd "contracts/$c" && cargo near build non-reproducible-wasm --locked)
          done
      - name: Sizes and hashes
        run: |
          ls -l target/near/*/*.wasm
          sha256sum target/near/*/*.wasm | tee wasm.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: |
            target/near/pactora/pactora.wasm
            target/near/pactora/pactora_abi.json
            target/near/mock_usdc/mock_usdc.wasm
            wasm.sha256
          if-no-files-found: error

  sandbox:
    name: sandbox integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
      - name: Sandbox tests (local NEAR node, compiled wasm)
        run: cargo test -p pactora --test sandbox -- --test-threads=2

  secrets:
    name: no secrets in tracked files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-no-secrets.mjs
