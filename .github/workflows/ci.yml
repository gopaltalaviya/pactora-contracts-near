name: contracts

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned, so a release of cargo-near cannot turn CI red on code nobody touched.
  CARGO_NEAR_VERSION: "0.22.0"

jobs:
  check:
    name: fmt · clippy · unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The toolchain comes from rust-toolchain.toml (rustup reads it).
      - name: Toolchain
        run: rustup show active-toolchain && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and property tests
        run: cargo test --workspace --lib

  wasm:
    name: build wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-near ${{ env.CARGO_NEAR_VERSION }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/near/cargo-near/releases/download/cargo-near-v${CARGO_NEAR_VERSION}/cargo-near-installer.sh" | sh
          cargo near --version
      # Reproducible (NEP-330): built inside the pinned image named in each
      # contract's [package.metadata.near.reproducible_build], from the
      # committed tree, so anyone can rebuild the same bytes and the deployed
      # code carries its source link (contract_source_metadata).
      - name: Build both contracts (reproducible, in Docker)
        run: |
          for c in pactora mock-usdc; do
            (cd "contracts/$c" && cargo near build reproducible-wasm)
          done
      - name: Sizes and hashes
        run: |
          ls -l target/near/*/*.wasm
          sha256sum target/near/*/*.wasm | tee target/near/wasm.sha256
      # All under target/near, so the artifact keeps pactora/ and mock_usdc/ at its root.
      - uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: |
            target/near/pactora/pactora.wasm
            target/near/pactora/pactora_abi.json
            target/near/mock_usdc/mock_usdc.wasm
            target/near/wasm.sha256
          if-no-files-found: error

  sandbox:
    name: sandbox integration tests (the CI-built wasm)
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm
      # The exact bytes the wasm job built and that get deployed — not a
      # second build from source (tests/sandbox.rs reads these when set).
      - name: Sandbox tests (local NEAR node)
        env:
          PACTORA_WASM: ${{ github.workspace }}/wasm/pactora/pactora.wasm
          MOCK_USDC_WASM: ${{ github.workspace }}/wasm/mock_usdc/mock_usdc.wasm
        run: cargo test -p pactora --test sandbox -- --test-threads=2

  live:
    name: deploy + verify-near on a fresh near-sandbox
    needs: wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: wasm
          path: wasm
      - run: npm ci
      # near-sandbox 2.14 needs glibc 2.38+; ubuntu-24.04 has 2.39.
      - name: Start near-sandbox (chain id sandbox, root test.near)
        run: |
          mkdir -p "$RUNNER_TEMP/sbx" && cd "$RUNNER_TEMP/sbx"
          npm init -y >/dev/null && npm install --silent near-sandbox@0.3.5
          npx near-sandbox --home "$RUNNER_TEMP/sbx/home" init --chain-id sandbox --account-id test.near
          (npx near-sandbox --home "$RUNNER_TEMP/sbx/home" run > "$RUNNER_TEMP/sbx/node.log" 2>&1 &)
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3030/status >/dev/null && break; sleep 2; done
          curl -fs http://127.0.0.1:3030/status | head -c 300
      - name: Deploy, then every flow live (17 checks), then again with the DAO arbiter (19)
        env:
          SANDBOX_KEY_FILE: ${{ runner.temp }}/sbx/home/validator_key.json
          PACTORA_WASM: ${{ github.workspace }}/wasm/pactora/pactora.wasm
          MOCK_USDC_WASM: ${{ github.workspace }}/wasm/mock_usdc/mock_usdc.wasm
          SPUTNIK_DAO_WASM: ${{ runner.temp }}/sputnik-dao.wasm
        run: |
          node scripts/deploy.mjs --network sandbox
          node scripts/verify-near.mjs --network sandbox
          # The Sputnik DAO code testnet's factory deploys, read from testnet and hash-checked.
          node scripts/create-dao.mjs --fetch-wasm "$SPUTNIK_DAO_WASM"
          node scripts/verify-near.mjs --network sandbox --dao

  secrets:
    name: no secrets in tracked files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-no-secrets.mjs
