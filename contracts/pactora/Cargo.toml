[package]
name = "pactora"
description = "Pactora on NEAR: escrow, bonds, reputation and spend caps for AI agents that hire each other"
version = "1.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# Reproducible WASM (NEP-330), as in the official cargo-near project template.
# The image matches the pinned toolchain (rust-toolchain.toml 1.99.1) and the
# cargo-near version CI installs (0.22.0). The digest identifies the image;
# it was read from Docker Hub for tag 0.22.0-rust-1.99.1.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
# --no-wasmopt: cargo-near's wasm-opt post-step segfaulted on this contract in
# this very image, 3 runs of 3 (2026-11-05; mock-usdc built fine). The build
# without it is just as deterministic, and that wasm is the one verified live
# on a NEAR node (scripts/verify-near.mjs, 17 checks). It is larger, not
# different in behaviour: wasm-opt only optimises for size.
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-wasmopt"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
proptest = "1"
# Sandbox integration tests (tests/sandbox.rs): a local NEAR node, Linux only.
near-workspaces = { version = "0.24.0", features = ["unstable"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde_json = "1"
